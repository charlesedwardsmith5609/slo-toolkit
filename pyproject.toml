[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-toolkit"
version = "0.2.0"
description = "SLO burn rate calculator, multi-window alert config generator, and compliance reporter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
slo-toolkit = "slo_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slo_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
