[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-toolkit"
version = "0.2.0"
description = "SLO burn rate calculator, multi-window alert config generator, and compliance reporter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
slo-toolkit = "slo_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slo_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["slo_toolkit", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["slo_toolkit"]
strict = true
warn_unreachable = true
